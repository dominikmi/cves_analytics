# Monte Carlo Simulation Scenarios Configuration

# Default simulation parameters
defaults:
  n_iterations: 1000
  random_seed: null  # null for random, or set integer for reproducibility
  output_format: ["json", "csv"]
  save_individual_runs: false
  save_aggregated_only: true

# Scenario definitions
scenarios:
  # Scenario 1: Small organization, initial maturity
  small_initial:
    org_size: small
    industry: consulting
    maturity: initial
    environment: dev
    description: "Small consulting firm with basic security controls"
    n_iterations: 1000
    
  # Scenario 2: Mid-size organization, managed maturity
  mid_managed:
    org_size: medium
    industry: financial-services
    maturity: managed
    environment: prod
    description: "Mid-size financial services with established security program"
    n_iterations: 1000
    
  # Scenario 3: Large organization, optimizing maturity
  large_optimizing:
    org_size: large
    industry: financial-services
    maturity: optimizing
    environment: prod
    description: "Large financial services with mature security operations"
    n_iterations: 1000

# Comparison scenarios for sensitivity analysis
comparisons:
  maturity_progression:
    base_config:
      org_size: medium
      industry: financial-services
      environment: prod
    variations:
      - maturity: initial
      - maturity: managed
      - maturity: optimizing
    description: "Compare risk across maturity levels"
    
  control_failure:
    base_config:
      org_size: large
      industry: financial-services
      maturity: optimizing
      environment: prod
    variations:
      - description: "Baseline - all controls active"
      - description: "WAF failure scenario"
        disable_controls: ["waf"]
      - description: "Firewall failure scenario"
        disable_controls: ["firewall"]
      - description: "Multiple control failure"
        disable_controls: ["waf", "ids_ips"]
    description: "Assess impact of control failures"

# Statistical analysis configuration
analysis:
  confidence_levels: [0.90, 0.95, 0.99]
  percentiles: [5, 25, 50, 75, 95, 99]
  bootstrap_samples: 10000
  
  metrics:
    - killchain_probability
    - actionable_vulnerabilities
    - bayesian_critical_count
    - bayesian_high_count
    - average_exploitation_probability
    
  comparisons:
    - type: "maturity_levels"
      test: "mann_whitney"  # Non-parametric test
    - type: "control_effectiveness"
      test: "correlation"

# Visualization configuration
visualization:
  plots:
    - type: "histogram"
      metric: "killchain_probability"
      bins: 50
    - type: "box_plot"
      metric: "killchain_probability"
      group_by: "maturity"
    - type: "violin_plot"
      metric: "actionable_vulnerabilities"
      group_by: "maturity"
    - type: "scatter"
      x_metric: "average_exploitation_probability"
      y_metric: "killchain_probability"
    - type: "heatmap"
      metric: "control_effectiveness"
      
  style:
    theme: "seaborn-v0_8-darkgrid"
    figure_size: [12, 8]
    dpi: 300
    color_palette: "viridis"
