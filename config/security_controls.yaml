# =============================================================================
# CONTROL MATURITY LEVELS
# =============================================================================
# Organizations typically implement controls in stages based on security maturity.
# This helps generate realistic scenarios where control presence correlates with
# organizational maturity level.
#
# Maturity Levels (based on NIST Cybersecurity Framework):
# - Level 1 (Initial): Ad-hoc, reactive security
# - Level 2 (Managed): Risk-informed, some policies
# - Level 3 (Defined): Formal policies, repeatable processes
# - Level 4 (Quantitatively Managed): Measured and controlled
# - Level 5 (Optimizing): Continuous improvement

control_maturity_levels:
  level_1_initial:
    # Basic controls - ad-hoc, reactive security
    # Reality: Many orgs lack even basic controls
    typical_controls:
      - firewall
      - antivirus
      - password_policy
    probability: 0.40  # Only 40% chance - many orgs lack basics
    description: "Ad-hoc security, reactive, no formal program"

  level_2_managed:
    # Risk-aware controls - some policies exist
    # Reality: Starting to invest but inconsistent
    typical_controls:
      - mfa
      - backup_recovery
      - endpoint_patching
      - ids_ips
      - security_awareness_training
    probability: 0.55  # 55% chance - inconsistent implementation
    description: "Risk-informed, some policies, inconsistent enforcement"

  level_3_defined:
    # Formal security program - repeatable processes
    # Reality: Mature orgs with dedicated security teams
    typical_controls:
      - edr_xdr
      - siem
      - vulnerability_management
      - network_segmentation
      - incident_response_plan
      - rbac
      - encryption_at_rest
      - waf
    probability: 0.70  # 70% chance - formal program in place
    description: "Formal policies, repeatable processes, dedicated security team"

  level_4_quantitatively_managed:
    # Measured and controlled - metrics-driven
    # Reality: Well-funded enterprises with mature programs
    typical_controls:
      - soc_24x7
      - privileged_access_mgmt
      - data_loss_prevention
      - threat_intelligence
      - penetration_testing
      - secure_sdlc
      - sast_dast
      - ngfw
      - network_access_control
    probability: 0.75  # 75% chance - well-resourced programs
    description: "Measured and controlled, metrics-driven, well-funded"

  level_5_optimizing:
    # Continuous improvement - cutting-edge
    # Reality: Only most mature orgs (FAANG, finance, defense)
    typical_controls:
      - soar
      - zero_trust
      - jit_access
      - application_whitelisting
      - software_composition_analysis
      - api_gateway
      - privileged_session_mgmt
      - threat_intelligence
    probability: 0.65  # 65% chance - even mature orgs don't have everything
    description: "Continuous improvement, cutting-edge, industry-leading"

# =============================================================================
# SECTOR-SPECIFIC MATURITY ADJUSTMENTS
# =============================================================================
# Different sectors have different security investment levels and regulatory
# requirements. This adjusts maturity probabilities based on sector.
#
# Multipliers applied to base maturity probabilities:
# - <1.0: Underinvested sectors (reduces probability)
# - >1.0: Well-invested sectors (increases probability)
#
# Academic & Industry References:
# 1. Verizon (2024). "Data Breach Investigations Report"
#    - https://www.verizon.com/business/resources/reports/dbir/
#    - Sector-specific breach statistics and control adoption rates
#    - Note: 2024 DBIR released May 2024, covers 2023 breach data
#
# 2. IBM Security (2024). "Cost of a Data Breach Report"
#    - https://www.ibm.com/reports/data-breach
#    - Security investment by sector, breach costs by industry
#    - Released July 2024, covers global breach cost data
#
# 3. SANS Institute (2024). "Cybersecurity Survey Reports"
#    - https://www.sans.org/white-papers/
#    - Security spending and control adoption by sector
#
# 4. Cybersecurity & Infrastructure Security Agency (CISA)
#    - https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience
#    - Critical infrastructure sector profiles and security guidance
#
# 5. Center for Internet Security (CIS) (2024). "CIS Controls"
#    - https://www.cisecurity.org/controls
#    - Control implementation guidance and adoption patterns
#
# 6. National Institute of Standards and Technology (NIST)
#    - https://www.nist.gov/cyberframework/industry-resources
#    - Cybersecurity Framework adoption by sector
#
# 7. ENISA (European Union Agency for Cybersecurity) (2024)
#    - https://www.enisa.europa.eu/topics/threat-risk-management
#    - Threat landscape and sector-specific security assessments

sector_maturity_adjustments:
  # Well-invested sectors (strong security culture)
  financial_services:
    multiplier: 1.3  # 30% increase - heavily regulated
    typical_maturity: 4  # Usually Level 4
    description: "Banks, insurance, fintech - heavily regulated, high investment"
    references:
      - "Verizon DBIR 2024: https://www.verizon.com/business/resources/reports/dbir/"
      - "IBM Cost of Data Breach 2024: https://www.ibm.com/reports/data-breach"
      - "FFIEC Cybersecurity Assessment Tool: https://www.ffiec.gov/cyberassessmenttool.htm"
      - "PCI Security Standards: https://www.pcisecuritystandards.org/"

  defense_government:
    multiplier: 1.4  # 40% increase - national security requirements
    typical_maturity: 5  # Usually Level 5
    description: "Defense contractors, government agencies - highest security"
    references:
      - "NIST SP 800-171: https://csrc.nist.gov/publications/detail/sp/800-171/rev-2/final"
      - "CMMC Model: https://dodcio.defense.gov/CMMC/Model/"
      - "FedRAMP: https://www.fedramp.gov/"
      - "DoD Zero Trust Strategy: https://dodcio.defense.gov/Portals/0/Documents/Library/DoD-ZTStrategy.pdf"

  technology:
    multiplier: 1.2  # 20% increase - security-aware culture
    typical_maturity: 4  # Usually Level 4
    description: "Tech companies, SaaS providers - security-aware"
    references:
      - "Verizon DBIR 2023: https://www.verizon.com/business/resources/reports/dbir/"
      - "SOC 2 Compliance: https://www.aicpa.org/interestareas/frc/assuranceadvisoryservices/aicpasoc2report"
      - "Cloud Security Alliance: https://cloudsecurityalliance.org/research/guidance/"

  healthcare_pharma:
    multiplier: 0.9  # 10% decrease - HIPAA but underinvested
    typical_maturity: 2  # Usually Level 2
    description: "Hospitals, clinics, pharma - HIPAA required but underinvested"
    references:
      - "Verizon DBIR 2023: https://www.verizon.com/business/resources/reports/dbir/"
      - "HHS Breach Portal: https://ocrportal.hhs.gov/ocr/breach/breach_report.jsf"
      - "HIPAA Security Rule: https://www.hhs.gov/hipaa/for-professionals/security/"
      - "IBM Cost of Data Breach 2023: https://www.ibm.com/reports/data-breach"

  # Underinvested sectors (weak security culture)
  education:
    multiplier: 0.6  # 40% decrease - chronically underfunded
    typical_maturity: 1  # Usually Level 1
    description: "Schools, universities - chronically underfunded"
    references:
      - "Verizon DBIR 2023: https://www.verizon.com/business/resources/reports/dbir/"
      - "K12 Security Information Exchange: https://www.k12six.org/"
      - "Educause Cybersecurity Program: https://www.educause.edu/focus-areas-and-initiatives/policy-and-security/cybersecurity-program"
      - "MS-ISAC K-12 Cybersecurity: https://www.cisecurity.org/ms-isac/services/k-12-cybersecurity"

  small_business:
    multiplier: 0.5  # 50% decrease - no dedicated security
    typical_maturity: 1  # Usually Level 1
    description: "SMBs <500 employees - no dedicated security staff"
    references:
      - "Verizon DBIR 2023: https://www.verizon.com/business/resources/reports/dbir/"
      - "NIST Small Business Cybersecurity: https://www.nist.gov/itl/smallbusinesscyber"
      - "CISA Small Business Guide: https://www.cisa.gov/resources-tools/resources/cybersecurity-guide-small-businesses"
      - "FTC Cybersecurity for Small Business: https://www.ftc.gov/business-guidance/small-businesses/cybersecurity"

  retail_hospitality:
    multiplier: 0.7  # 30% decrease - PCI-DSS but minimal investment
    typical_maturity: 2  # Usually Level 2
    description: "Retail, restaurants, hotels - PCI-DSS but minimal beyond compliance"
    references:
      - "Verizon DBIR 2023: https://www.verizon.com/business/resources/reports/dbir/"
      - "PCI DSS v4.0: https://www.pcisecuritystandards.org/document_library/"
      - "Verizon Payment Security Report: https://www.verizon.com/business/resources/reports/payment-security-report/"
      - "National Retail Federation Security: https://nrf.com/topics/loss-prevention-and-security"

  manufacturing:
    multiplier: 0.8  # 20% decrease - OT security challenges
    typical_maturity: 2  # Usually Level 2
    description: "Manufacturing, industrial - OT/IT convergence challenges"
    references:
      - "Verizon DBIR 2023: https://www.verizon.com/business/resources/reports/dbir/"
      - "CISA ICS Advisories: https://www.cisa.gov/news-events/cybersecurity-advisories"
      - "NIST Manufacturing Profile: https://www.nist.gov/cyberframework/manufacturing-profile"
      - "Dragos ICS/OT Report: https://www.dragos.com/resources/"

  # Moderate investment sectors
  energy_utilities:
    multiplier: 1.0  # No change - NERC CIP but legacy systems
    typical_maturity: 3  # Usually Level 3
    description: "Power, oil & gas, water - regulated but legacy infrastructure"
    references:
      - "NERC CIP Standards: https://www.nerc.com/pa/Stand/Pages/CIPStandards.aspx"
      - "CISA Energy Sector: https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors/energy-sector"
      - "DOE Cybersecurity Capability Maturity Model: https://www.energy.gov/ceser/cybersecurity-capability-maturity-model-c2m2"
      - "ICS-CERT Advisories: https://www.cisa.gov/news-events/cybersecurity-advisories"

  telecommunications:
    multiplier: 1.1  # 10% increase - critical infrastructure
    typical_maturity: 3  # Usually Level 3
    description: "Telecom, ISPs - critical infrastructure, moderate investment"
    references:
      - "CISA Communications Sector: https://www.cisa.gov/topics/critical-infrastructure-security-and-resilience/critical-infrastructure-sectors/communications-sector"
      - "FCC CSRIC Best Practices: https://www.fcc.gov/general/communications-security-reliability-and-interoperability-council"
      - "Verizon DBIR 2024: https://www.verizon.com/business/resources/reports/dbir/"
      - "NIST Telecom Profile: https://www.nist.gov/cyberframework/industry-resources"

  media_entertainment:
    multiplier: 0.75  # 25% decrease - IP protection focus only
    typical_maturity: 2  # Usually Level 2
    description: "Media, entertainment, gaming - IP protection but limited security"
    references:
      - "Verizon DBIR 2024: https://www.verizon.com/business/resources/reports/dbir/"
      - "MPAA Content Security: https://www.motionpictures.org/what-we-do/advancing-creativity/additional-resources/content-security/"
      - "Cloud Security Alliance Media: https://cloudsecurityalliance.org/"

  nonprofit:
    multiplier: 0.55  # 45% decrease - severely underfunded
    typical_maturity: 1  # Usually Level 1
    description: "Nonprofits, charities, NGOs - severely underfunded"
    references:
      - "NTEN Cybersecurity: https://www.nten.org/"
      - "CISA Nonprofit Cybersecurity: https://www.cisa.gov/resources-tools/groups/nonprofit-organizations"
      - "Verizon DBIR 2024: https://www.verizon.com/business/resources/reports/dbir/"
      - "National Council of Nonprofits: https://www.councilofnonprofits.org/tools-resources/cybersecurity-nonprofits"

