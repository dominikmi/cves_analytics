    exposure: internal
  - name: php-fpm
    image: php:8.1-fpm
    versions:
      - php:8.1-fpm
      - php:7.4-fpm
    role: app_server
    exposure: internal
  - name: apache-tomcat
    image: tomcat:9.0
    versions:
      - tomcat:9.0
