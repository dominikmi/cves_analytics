
proxy:
  - name: nginx-proxy
    image: nginx:latest
    versions:
      - nginx:latest
      - nginx:1.21
      - nginx:1.18
    role: load_balancer
    exposure: internet-facing
  - name: traefik
    image: traefik:v2.9
    versions:
      - traefik:v2.9
      - traefik:v2.5
      - traefik:v2.2
    role: ingress_controller
    exposure: internet-facing
  - name: haproxy
    image: haproxy:2.4
    versions:
      - haproxy:2.4
      - haproxy:2.2
      - haproxy:2.0
    role: load_balancer
    exposure: internet-facing
  - name: varnish
    image: varnish:7.0
    versions:
      - varnish:7.0
      - varnish:6.0
    role: cache_proxy
    exposure: internal
  - name: squid
    image: sameersbn/squid:latest
    versions:
      - sameersbn/squid:3.5.27
    role: forward_proxy
    exposure: internal

