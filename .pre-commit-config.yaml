repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy
        name: MyPy
        entry: uv run mypy src/
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false

      - id: trufflehog
        name: TruffleHog
        entry: trufflehog filesystem --fail --no-update
        language: system
        stages: [pre-commit]
        require_serial: true

      # Skip the optional `rag` group: fastembed pins pillow<13, so pillow
      # 12.3.0's 41 advisories have no installable fix (tracked upstream).
      # --ignore GHSA-cx6f-vjhg-g3cc: virtualenv 21.14.11 bash-activator
      # regression; the fix (21.14.13) is too fresh for the 7-day window.
      - id: uv-audit
        name: UV Audit
        entry: uv audit --no-group rag --ignore GHSA-cx6f-vjhg-g3cc
        language: system
        pass_filenames: false

      - id: bandit
        name: Bandit
        entry: uv run bandit -r src/ -c .bandit
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
